<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #feedback { min-height: 1.5em; }
    #answer { border-top: 1px solid #ccc; padding-top: 1rem; }
    #draft { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="feedback" role="status" aria-live="polite"></p>
  <section id="answer" hidden>
    <h2>Результат</h2>
    <p>Тема: <strong id="topic"></strong></p>
    <p id="draft"></p>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const feedback = document.querySelector("#feedback");
    const answer = document.querySelector("#answer");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const button = form.querySelector("button");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      answer.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
      feedback.textContent = "Обрабатываем заявку…";
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const result = await reply.json();
        if (result.status === "ready") {
          topic.textContent = result.topic;
          draft.textContent = result.draft;
          answer.hidden = false;
          feedback.textContent = "Черновик готов. Проверьте его перед отправкой.";
        } else if (result.status === "manual_review") {
          feedback.textContent = "Не удалось подготовить черновик. Проверьте заявку и ответьте клиенту вручную.";
        } else {
          feedback.textContent = "Введите текст заявки, чтобы продолжить.";
        }
      } catch {
        feedback.textContent = "Сервис временно недоступен. Проверьте заявку и ответьте клиенту вручную.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
